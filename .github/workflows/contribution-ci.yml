name: Contribution CI
run-name: "Contribution CI - ${{ inputs.revision }}"
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact commit SHA in this fork to validate
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: contribution-ci-${{ inputs.revision }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
jobs:
  ci:
    name: Full workspace CI (Linux + wasm)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Validate revision
        env:
          REVISION: ${{ inputs.revision }}
        run: '[[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev libxkbcommon-dev libwayland-dev libudev-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libasound2-dev libgl1-mesa-dev mesa-vulkan-drivers
      - name: Confirm checked-out commit
        env:
          REVISION: ${{ inputs.revision }}
        run: 'test "$(git rev-parse HEAD)" = "$REVISION"'
      - name: Full quality gate
        run: cargo xtask ci
